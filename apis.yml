aid: soda-health
name: Soda Health
description: >-
  Soda Health is a healthcare benefits technology company that builds a benefits
  administration and "health wallet" platform for health plans, powering
  supplemental benefits for Medicare Advantage and Medicaid members such as
  over-the-counter (OTC), healthy food and grocery, and other flex/spending-card
  benefits. The company now operates as Evermore Outcomes — sodahealth.com
  redirects to evermoreoutcomes.com and the product documentation is branded
  "Evermore Product Documentation," while account and program references still
  carry the Soda Health name. The public developer surface found is the Evermore
  Docs Portal API (docs.evermoreoutcomes.com): a Confluence-backed, customer-facing
  documentation portal secured with magic-link tokens and OIDC single sign-on,
  scoped per customer program. The core benefits/wallet product APIs are gated
  behind that portal and are not publicly published. Soda Health was surfaced as a
  portfolio company of Lightspeed Venture Partners.
